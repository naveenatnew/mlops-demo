name: ML CD Pipeline

on:
  workflow_run:
    workflows: ["ML CI Pipeline"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mlops-demo:${{ github.sha }} .

      # Push Docker image
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/mlops-demo:${{ github.sha }}

      # Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set kubectl context
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-mlops-demo
          cluster-name: aks-mlops-demo

      # Deploy
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/

      - name: Update Image
        run: |
          kubectl set image deployment/mlops-api \
            mlops-api=ghcr.io/${{ github.repository_owner }}/mlops-demo:${{ github.sha }} \
            -n mlops
            
      # Wait for rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/mlops-api -n mlops
name: CD Pipeline

on:
  workflow_run:
    workflows: ["ML CI Pipeline"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mlops-demo:${{ github.sha }} .
      
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/mlops-demo:${{ github.sha }}
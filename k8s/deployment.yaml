apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-api
  namespace: mlops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mlops-api

  template:

    metadata:
      labels:
        app: mlops-api

    spec:

      containers:

      - name: mlops-api

        image: ghcr.io/naveenatnew/mlops-demo:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 8000

          initialDelaySeconds: 20
          periodSeconds: 10